name: Confirmatory TRAIN MODE recovery v1

on:
  push:
    branches:
      - main
    paths:
      - "reproducibility/launch/CONFIRMATORY_TRAIN_MODE_RECOVERY_V1.token"

permissions:
  contents: read

jobs:
  mode-recovery:
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed_start: 1001
            seed_end: 1006
            shard: 01
          - seed_start: 1007
            seed_end: 1012
            shard: 02
          - seed_start: 1013
            seed_end: 1018
            shard: 03
          - seed_start: 1019
            seed_end: 1024
            shard: 04
          - seed_start: 1025
            seed_end: 1030
            shard: 05
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout launch commit
        uses: actions/checkout@v4

      - name: Verify recovery token
        run: |
          python - <<'PY'
          from pathlib import Path
          vals = {}
          for line in Path("reproducibility/launch/CONFIRMATORY_TRAIN_MODE_RECOVERY_V1.token").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  vals[k.strip()] = v.strip()
          assert vals["protocol"] == "opencem-confirmatory-prelock-v1"
          assert vals["method"] == "MODE"
          assert vals["seeds"] == "1001-1030"
          assert vals["budget"] == "12600"
          assert vals["original_train_run_id"] == "35368457130"
          assert vals["frozen_code_sha"] == "be5756321617087ca421a639d60a99513f29d889"
          assert vals["recovery_reason"] == "original MODE job reached 360-minute workflow timeout"
          PY

      - name: Checkout exact frozen TRAIN code snapshot
        uses: actions/checkout@v4
        with:
          ref: be5756321617087ca421a639d60a99513f29d889
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen project snapshot
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Acquire immutable OpenCEM data
        run: |
          mkdir -p .tmp/opencem .tmp/verification outputs
          python tools/opencem_ingest.py \
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \
            --raw-root .tmp/opencem \
            --result-csv .tmp/verification/opencem_full.csv \
            --result-json .tmp/verification/opencem_full.json

      - name: Execute frozen MODE recovery shard
        run: |
          python tools/opencem_confirmatory_batch.py \
            --method MODE \
            --seed-start "${{ matrix.seed_start }}" \
            --seed-end "${{ matrix.seed_end }}" \
            --raw-root .tmp/opencem \
            --verification-csv .tmp/verification/opencem_full.csv \
            --block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --output-root outputs

      - name: Upload MODE recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: "confirmatory-train-mode-recovery-${{ matrix.shard }}"
          path: |
            outputs/
            .tmp/verification/opencem_full.json
          if-no-files-found: error
          retention-days: 90
