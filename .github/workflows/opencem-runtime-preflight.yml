name: OpenCEM runtime preflight

on:
  push:
    paths:
      - ".github/workflows/opencem-runtime-preflight.yml"
      - "tools/opencem_runtime_preflight.py"
      - "tools/opencem_qa.py"
      - "src/crmt_edge_ems/site_model.py"
      - "src/crmt_edge_ems/protocol.py"
      - "src/crmt_edge_ems/replay.py"
      - "reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Download and verify immutable OpenCEM data
        run: |
          mkdir -p .tmp/opencem .tmp/verification .tmp/runtime
          python tools/opencem_ingest.py \
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \
            --raw-root .tmp/opencem \
            --result-csv .tmp/verification/opencem_full.csv \
            --result-json .tmp/verification/opencem_full.json

      - name: Run controller-block runtime preflight
        run: |
          python tools/opencem_runtime_preflight.py \
            --raw-root .tmp/opencem \
            --verification-csv .tmp/verification/opencem_full.csv \
            --lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --output-json .tmp/runtime/opencem_runtime_preflight.json \
            --samples-per-inverter 5

      - name: Upload runtime metadata only
        uses: actions/upload-artifact@v4
        with:
          name: opencem-runtime-preflight
          path: |
            .tmp/runtime/opencem_runtime_preflight.json
            .tmp/verification/opencem_full.json
          if-no-files-found: error
          retention-days: 14
