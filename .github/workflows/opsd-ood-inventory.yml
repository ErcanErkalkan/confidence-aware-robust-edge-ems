name: OPSD OOD eligible-day inventory v1

on:
  push:
    branches:
      - main
    paths:
      - "reproducibility/launch/OPSD_OOD_INVENTORY_V1.token"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Verify inventory token
        run: |
          python - <<'PY'
          from pathlib import Path
          vals = {}
          for line in Path("reproducibility/launch/OPSD_OOD_INVENTORY_V1.token").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  vals[k.strip()] = v.strip()
          assert vals["artifact_sha256"] == "17c41c778bf8ce9a6e483c179664afc66af2e5eddda869e359c719fc037013b3"
          assert vals["scope"] == "INVENTORY_ONLY_NO_OOD_RESULTS"
          PY

      - name: Download exact locked OPSD package
        run: |
          mkdir -p .tmp/opsd outputs
          curl --fail --location --retry 5 --retry-delay 5 \
            --output .tmp/opsd/opsd-household_data-2020-04-15.zip \
            https://data.open-power-system-data.org/household_data/opsd-household_data-2020-04-15.zip

      - name: Generate strict eligible-day inventory
        run: |
          python tools/opsd_ood_inventory.py \
            --zip .tmp/opsd/opsd-household_data-2020-04-15.zip \
            --artifact-lock-json reproducibility/manifests/opsd_household_2020-04-15_lock_v1.json \
            --output-csv outputs/opsd_ood_eligible_days_v1.csv \
            --output-json outputs/opsd_ood_inventory_summary_v1.json

      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: opsd-ood-eligible-day-inventory-v1
          path: outputs/
          if-no-files-found: error
          retention-days: 90
