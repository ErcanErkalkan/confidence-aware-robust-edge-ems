name: CRMT OpenCEM ablation TRAIN run

on:
  workflow_dispatch:
    inputs:
      ablation:
        description: "Single-component CRMT ablation"
        required: true
        type: choice
        options:
          - NO_CVAR
          - NO_CONFIDENCE
          - NO_ADAPTIVE
      seed:
        description: "Frozen optimizer seed (1001-1030)"
        required: true
        default: "1001"
        type: string

permissions:
  contents: read

jobs:
  ablation-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate frozen seed
        run: |
          python - <<'PY'
          seed = int("${{ inputs.seed }}")
          assert 1001 <= seed <= 1030, seed
          PY

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Acquire immutable OpenCEM data
        run: |
          mkdir -p .tmp/opencem .tmp/verification outputs
          python tools/opencem_ingest.py \
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \
            --raw-root .tmp/opencem \
            --result-csv .tmp/verification/opencem_full.csv \
            --result-json .tmp/verification/opencem_full.json

      - name: Run isolated ablation
        run: |
          python tools/opencem_crmt_ablation_train.py \
            --ablation "${{ inputs.ablation }}" \
            --seed "${{ inputs.seed }}" \
            --raw-root .tmp/opencem \
            --verification-csv .tmp/verification/opencem_full.csv \
            --block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --output-dir "outputs/${{ inputs.ablation }}_seed${{ inputs.seed }}"

      - name: Upload ablation artifact
        uses: actions/upload-artifact@v4
        with:
          name: "crmt-ablation-${{ inputs.ablation }}-seed${{ inputs.seed }}"
          path: "outputs/${{ inputs.ablation }}_seed${{ inputs.seed }}/"
          if-no-files-found: error
          retention-days: 90
