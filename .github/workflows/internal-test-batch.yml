name: One-shot internal-test batch v1

on:
  push:
    branches:
      - main
    paths:
      - "reproducibility/launch/INTERNAL_TEST_BATCH_V1.token"

permissions:
  contents: read
  actions: read

jobs:
  internal-batch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed_start: 1001
            seed_end: 1006
            shard: 01
          - seed_start: 1007
            seed_end: 1012
            shard: 02
          - seed_start: 1013
            seed_end: 1018
            shard: 03
          - seed_start: 1019
            seed_end: 1024
            shard: 04
          - seed_start: 1025
            seed_end: 1030
            shard: 05
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: "${{ github.token }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Read and verify launch token
        id: launch
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          lines = {}
          for line in Path("reproducibility/launch/INTERNAL_TEST_BATCH_V1.token").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  lines[k.strip()] = v.strip()
          assert lines["protocol"] == "opencem-confirmatory-prelock-v1"
          assert lines["validation_batch_conclusion"] == "success"
          assert len(lines["validation_selection_root_sha256"]) == 64
          print(f"validation_run_id={int(lines['validation_batch_run_id'])}")
          print(f"validation_selection_root_sha256={lines['validation_selection_root_sha256']}")
          PY

      - name: Download all validation selection artifacts
        shell: bash
        run: |
          mkdir -p validation_batch_artifacts
          gh run download "${{ steps.launch.outputs.validation_run_id }}" \
            --repo "${{ github.repository }}" \
            --dir validation_batch_artifacts

      - name: Audit frozen validation selection root
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("validation_batch_artifacts")
          records = []
          for seed in range(1001, 1031):
              name = f"validation_selection_seed{seed}"
              matches = sorted(
                  p for p in root.rglob(name)
                  if p.is_dir()
                  and (p / "selection_lock.json").is_file()
                  and (p / "selected_candidates.csv").is_file()
              )
              if len(matches) != 1:
                  raise RuntimeError(
                      f"expected exactly one frozen validation selection for seed {seed}, found {len(matches)}"
                  )
              selection_dir = matches[0]
              lock_path = selection_dir / "selection_lock.json"
              selected_path = selection_dir / "selected_candidates.csv"
              lock_sha = hashlib.sha256(lock_path.read_bytes()).hexdigest()
              selected_sha = hashlib.sha256(selected_path.read_bytes()).hexdigest()
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              if int(lock.get("seed")) != seed:
                  raise RuntimeError(f"selection seed mismatch for {seed}")
              if lock.get("selected_candidates_sha256") != selected_sha:
                  raise RuntimeError(f"selected-candidate hash mismatch for seed {seed}")
              records.append(f"{seed}|{lock_sha}|{selected_sha}")

          observed = hashlib.sha256("\n".join(records).encode("utf-8")).hexdigest()
          expected = "${{ steps.launch.outputs.validation_selection_root_sha256 }}"
          if observed != expected:
              raise RuntimeError(
                  f"validation selection root mismatch: observed={observed} expected={expected}"
              )
          print(f"verified validation selection root: {observed}")
          PY

      - name: Acquire immutable OpenCEM data once for this shard
        run: |
          mkdir -p .tmp/opencem .tmp/verification outputs
          python tools/opencem_ingest.py \
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \
            --raw-root .tmp/opencem \
            --result-csv .tmp/verification/opencem_full.csv \
            --result-json .tmp/verification/opencem_full.json

      - name: Execute one-shot internal-test shard
        run: |
          python tools/opencem_internal_batch.py \
            --seed-start "${{ matrix.seed_start }}" \
            --seed-end "${{ matrix.seed_end }}" \
            --raw-root .tmp/opencem \
            --verification-csv .tmp/verification/opencem_full.csv \
            --block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --selection-root validation_batch_artifacts \
            --output-root outputs

      - name: Upload internal-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: "internal-test-batch-${{ matrix.shard }}"
          path: outputs/
          if-no-files-found: error
          retention-days: 90
