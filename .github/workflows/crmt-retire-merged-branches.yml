name: CRMT retire merged legacy branches (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/crmt-retire-merged-branches.yml']
permissions:
  contents: write
jobs:
  retire-legacy-branches:
    if: github.repository == 'ErcanErkalkan/confidence-aware-robust-edge-ems'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify both branches are fully included in main, then delete their refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in             'audit/crmt-eaai-gate2-30seed-20261009'             'revision/crmt-eaai-evidence-sync-20261011'
          do
            echo "Checking $branch"
            response=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...${branch}")
            ahead=$(jq -r '.ahead_by' <<< "$response")
            if [[ "$ahead" != '0' ]]; then
              echo "::error title=Unsafe branch deletion::The branch $branch has $ahead commit(s) not on main."
              exit 1
            fi
            head_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/${branch}" --jq '.object.sha')
            [[ -n "$head_ref" ]]
            echo "Deleting merged branch $branch at $head_ref"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${branch}"
          done
          echo "Done: only canonical main remains."
