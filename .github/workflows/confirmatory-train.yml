name: Confirmatory OpenCEM TRAIN optimization

on:
  workflow_dispatch:
    inputs:
      method:
        description: "Optimizer method"
        required: true
        type: choice
        options:
          - SOBOL
          - NSGAII
          - MOPSO
          - MODE
          - CRMT
      seed:
        description: "Frozen optimizer seed (1001-1030)"
        required: true
        default: "1001"
        type: string

permissions:
  contents: read

jobs:
  confirmatory-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate frozen seed
        shell: bash
        run: |
          python - <<'PY'
          seed = int("${{ inputs.seed }}")
          assert 1001 <= seed <= 1030, seed
          PY

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Acquire immutable OpenCEM data
        run: |
          mkdir -p .tmp/opencem .tmp/verification outputs
          python tools/opencem_ingest.py \\
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \\
            --raw-root .tmp/opencem \\
            --result-csv .tmp/verification/opencem_full.csv \\
            --result-json .tmp/verification/opencem_full.json

      - name: Run frozen TRAIN optimization
        run: |
          python tools/opencem_confirmatory_train.py \\
            --method "${{ inputs.method }}" \\
            --seed "${{ inputs.seed }}" \\
            --raw-root .tmp/opencem \\
            --verification-csv .tmp/verification/opencem_full.csv \\
            --block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \\
            --output-dir "outputs/${{ inputs.method }}_seed${{ inputs.seed }}"

      - name: Upload confirmatory TRAIN artifact
        uses: actions/upload-artifact@v4
        with:
          name: "confirmatory-train-${{ inputs.method }}-seed${{ inputs.seed }}"
          path: "outputs/${{ inputs.method }}_seed${{ inputs.seed }}/"
          if-no-files-found: error
          retention-days: 90
