name: OPSD external OOD batch v1

on:
  push:
    branches:
      - main
    paths:
      - "reproducibility/launch/OPSD_OOD_BATCH_V1.token"

permissions:
  contents: read
  actions: read

jobs:
  ood-batch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed_start: 1001
            seed_end: 1003
            shard: 01
          - seed_start: 1004
            seed_end: 1006
            shard: 02
          - seed_start: 1007
            seed_end: 1009
            shard: 03
          - seed_start: 1010
            seed_end: 1012
            shard: 04
          - seed_start: 1013
            seed_end: 1015
            shard: 05
          - seed_start: 1016
            seed_end: 1018
            shard: 06
          - seed_start: 1019
            seed_end: 1021
            shard: 07
          - seed_start: 1022
            seed_end: 1024
            shard: 08
          - seed_start: 1025
            seed_end: 1027
            shard: 09
          - seed_start: 1028
            seed_end: 1030
            shard: 10
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: "${{ github.token }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Read anti-leakage launch dependencies
        id: launch
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          vals = {}
          for line in Path("reproducibility/launch/OPSD_OOD_BATCH_V1.token").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  vals[k.strip()] = v.strip()
          assert vals["protocol"] == "opencem-confirmatory-prelock-v1"
          assert vals["validation_batch_conclusion"] == "success"
          assert vals["internal_batch_conclusion"] == "success"
          assert vals["opsd_package_sha256"] == "17c41c778bf8ce9a6e483c179664afc66af2e5eddda869e359c719fc037013b3"
          assert vals["opsd_replay_manifest_sha256"] == "7e6137adf98a4b5c604fd047891297458b0a2dc606e32f2e8b9e3dba562bea1d"
          print(f"validation_run_id={int(vals['validation_batch_run_id'])}")
          print(f"internal_run_id={int(vals['internal_batch_run_id'])}")
          PY

      - name: Download selection and primary internal-test evidence
        shell: bash
        run: |
          mkdir -p validation_batch_artifacts internal_batch_artifacts
          gh run download "${{ steps.launch.outputs.validation_run_id }}" \
            --repo "${{ github.repository }}" \
            --dir validation_batch_artifacts
          gh run download "${{ steps.launch.outputs.internal_run_id }}" \
            --repo "${{ github.repository }}" \
            --dir internal_batch_artifacts

      - name: Download exact locked OPSD package
        run: |
          mkdir -p .tmp/opsd outputs
          curl --fail --location --retry 5 --retry-delay 5 \
            --output .tmp/opsd/opsd-household_data-2020-04-15.zip \
            https://data.open-power-system-data.org/household_data/opsd-household_data-2020-04-15.zip

      - name: Execute frozen external OOD shard
        run: |
          python tools/opsd_ood_batch.py \
            --seed-start "${{ matrix.seed_start }}" \
            --seed-end "${{ matrix.seed_end }}" \
            --zip .tmp/opsd/opsd-household_data-2020-04-15.zip \
            --artifact-lock-json reproducibility/manifests/opsd_household_2020-04-15_lock_v1.json \
            --base-inventory-lock-json reproducibility/manifests/opsd_ood_eligible_day_inventory_lock_v1.json \
            --full-replay-lock-json reproducibility/manifests/opsd_ood_full_regular_replay_lock_v1.json \
            --opencem-block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --selection-root validation_batch_artifacts \
            --primary-internal-root internal_batch_artifacts \
            --output-root outputs

      - name: Upload external OOD evidence
        uses: actions/upload-artifact@v4
        with:
          name: "opsd-ood-batch-${{ matrix.shard }}"
          path: outputs/
          if-no-files-found: error
          retention-days: 90
