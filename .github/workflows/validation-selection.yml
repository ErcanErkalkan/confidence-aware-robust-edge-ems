name: OpenCEM validation selection

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Frozen optimizer seed (1001-1030)"
        required: true
        type: string
      sobol_run_id:
        description: "TRAIN workflow run ID for SOBOL"
        required: true
        type: string
      nsga2_run_id:
        description: "TRAIN workflow run ID for NSGAII"
        required: true
        type: string
      mopso_run_id:
        description: "TRAIN workflow run ID for MOPSO"
        required: true
        type: string
      mode_run_id:
        description: "TRAIN workflow run ID for MODE"
        required: true
        type: string
      crmt_run_id:
        description: "TRAIN workflow run ID for CRMT"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validation-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate frozen seed
        run: |
          python - <<'PY'
          seed = int("${{ inputs.seed }}")
          assert 1001 <= seed <= 1030, seed
          PY

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Download the five frozen TRAIN artifacts
        shell: bash
        run: |
          seed="${{ inputs.seed }}"
          mkdir -p train_runs
          gh run download "${{ inputs.sobol_run_id }}" --repo "${{ github.repository }}" --name "confirmatory-train-SOBOL-seed$seed" --dir "train_runs/SOBOL_seed$seed"
          gh run download "${{ inputs.nsga2_run_id }}" --repo "${{ github.repository }}" --name "confirmatory-train-NSGAII-seed$seed" --dir "train_runs/NSGAII_seed$seed"
          gh run download "${{ inputs.mopso_run_id }}" --repo "${{ github.repository }}" --name "confirmatory-train-MOPSO-seed$seed" --dir "train_runs/MOPSO_seed$seed"
          gh run download "${{ inputs.mode_run_id }}" --repo "${{ github.repository }}" --name "confirmatory-train-MODE-seed$seed" --dir "train_runs/MODE_seed$seed"
          gh run download "${{ inputs.crmt_run_id }}" --repo "${{ github.repository }}" --name "confirmatory-train-CRMT-seed$seed" --dir "train_runs/CRMT_seed$seed"

      - name: Acquire immutable OpenCEM data
        run: |
          mkdir -p .tmp/opencem .tmp/verification outputs
          python tools/opencem_ingest.py \
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \
            --raw-root .tmp/opencem \
            --result-csv .tmp/verification/opencem_full.csv \
            --result-json .tmp/verification/opencem_full.json

      - name: Evaluate TRAIN fronts on validation and freeze selection
        run: |
          python tools/opencem_validation_select.py \
            --seed "${{ inputs.seed }}" \
            --raw-root .tmp/opencem \
            --verification-csv .tmp/verification/opencem_full.csv \
            --block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --train-run-root train_runs \
            --output-dir "outputs/validation_selection_seed${{ inputs.seed }}"

      - name: Upload selection lock
        uses: actions/upload-artifact@v4
        with:
          name: "validation-selection-seed${{ inputs.seed }}"
          path: "outputs/validation_selection_seed${{ inputs.seed }}/"
          if-no-files-found: error
          retention-days: 90
