name: Site temporal sensitivity report v1

on:
  push:
    branches:
      - main
    paths:
      - "reproducibility/launch/SENSITIVITY_REPORT_V1.token"

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: "${{ github.token }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Read sensitivity-report prerequisites
        id: launch
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          vals = {}
          for line in Path("reproducibility/launch/SENSITIVITY_REPORT_V1.token").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  vals[k.strip()] = v.strip()
          assert vals["protocol"] == "opencem-confirmatory-prelock-v1"
          assert vals["primary_validation_conclusion"] == "success"
          assert vals["primary_internal_conclusion"] == "success"
          assert vals["sensitivity_batch_conclusion"] == "success"
          assert len(vals["primary_validation_root_sha256"]) == 64
          assert len(vals["primary_internal_root_sha256"]) == 64
          assert len(vals["sensitivity_root_sha256"]) == 64
          print(f"primary_validation_run_id={int(vals['primary_validation_run_id'])}")
          print(f"primary_internal_run_id={int(vals['primary_internal_run_id'])}")
          print(f"sensitivity_run_id={int(vals['sensitivity_run_id'])}")
          print(f"primary_validation_root_sha256={vals['primary_validation_root_sha256']}")
          print(f"primary_internal_root_sha256={vals['primary_internal_root_sha256']}")
          print(f"sensitivity_root_sha256={vals['sensitivity_root_sha256']}")
          PY

      - name: Download primary and sensitivity evidence
        run: |
          mkdir -p primary_validation primary_internal sensitivity outputs
          gh run download "${{ steps.launch.outputs.primary_validation_run_id }}" \
            --repo "${{ github.repository }}" --dir primary_validation
          gh run download "${{ steps.launch.outputs.primary_internal_run_id }}" \
            --repo "${{ github.repository }}" --dir primary_internal
          gh run download "${{ steps.launch.outputs.sensitivity_run_id }}" \
            --repo "${{ github.repository }}" --dir sensitivity

      - name: Audit frozen primary and sensitivity roots
        run: |
          python tools/evidence_roots.py --stage validation --root primary_validation \
            --expected-root "${{ steps.launch.outputs.primary_validation_root_sha256 }}"
          python tools/evidence_roots.py --stage internal --root primary_internal \
            --expected-root "${{ steps.launch.outputs.primary_internal_root_sha256 }}"
          python tools/evidence_roots.py --stage sensitivity --root sensitivity \
            --expected-root "${{ steps.launch.outputs.sensitivity_root_sha256 }}"

      - name: Build paired sensitivity report
        run: |
          python tools/opencem_sensitivity_report.py \
            --primary-selection-root primary_validation \
            --primary-internal-root primary_internal \
            --sensitivity-root sensitivity \
            --block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --output-dir outputs

      - name: Upload sensitivity statistical report
        uses: actions/upload-artifact@v4
        with:
          name: site-temporal-sensitivity-statistical-report-v1
          path: outputs/
          if-no-files-found: error
          retention-days: 90
