name: CRMT ablation one-shot internal batch v1

on:
  push:
    branches:
      - main
    paths:
      - "reproducibility/launch/CRMT_ABLATION_INTERNAL_BATCH_V1.token"

permissions:
  contents: read
  actions: read

jobs:
  ablation-internal:
    strategy:
      fail-fast: false
      matrix:
        ablation:
          - NO_CVAR
          - NO_CONFIDENCE
          - NO_ADAPTIVE
        shard:
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: "${{ github.token }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Read ablation-validation prerequisite
        id: launch
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          vals = {}
          for line in Path("reproducibility/launch/CRMT_ABLATION_INTERNAL_BATCH_V1.token").read_text().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  vals[k.strip()] = v.strip()
          assert vals["protocol"] == "opencem-confirmatory-prelock-v1"
          assert vals["ablation_validation_conclusion"] == "success"
          print(f"ablation_validation_run_id={int(vals['ablation_validation_run_id'])}")
          PY

      - name: Map shard to frozen seed range
        id: shard
        run: |
          case "${{ matrix.shard }}" in
            01) echo "start=1001" >> "$GITHUB_OUTPUT"; echo "end=1006" >> "$GITHUB_OUTPUT" ;;
            02) echo "start=1007" >> "$GITHUB_OUTPUT"; echo "end=1012" >> "$GITHUB_OUTPUT" ;;
            03) echo "start=1013" >> "$GITHUB_OUTPUT"; echo "end=1018" >> "$GITHUB_OUTPUT" ;;
            04) echo "start=1019" >> "$GITHUB_OUTPUT"; echo "end=1024" >> "$GITHUB_OUTPUT" ;;
            05) echo "start=1025" >> "$GITHUB_OUTPUT"; echo "end=1030" >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac

      - name: Download ablation validation locks
        run: |
          mkdir -p ablation_validation_artifacts
          gh run download "${{ steps.launch.outputs.ablation_validation_run_id }}" \
            --repo "${{ github.repository }}" \
            --dir ablation_validation_artifacts

      - name: Acquire immutable OpenCEM data once for this shard
        run: |
          mkdir -p .tmp/opencem .tmp/verification outputs
          python tools/opencem_ingest.py \
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \
            --raw-root .tmp/opencem \
            --result-csv .tmp/verification/opencem_full.csv \
            --result-json .tmp/verification/opencem_full.json

      - name: Execute one-shot ablation internal-test shard
        run: |
          python tools/opencem_ablation_internal_batch.py \
            --ablation "${{ matrix.ablation }}" \
            --seed-start "${{ steps.shard.outputs.start }}" \
            --seed-end "${{ steps.shard.outputs.end }}" \
            --raw-root .tmp/opencem \
            --verification-csv .tmp/verification/opencem_full.csv \
            --block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --ablation-selection-root ablation_validation_artifacts \
            --output-root outputs

      - name: Upload held-out ablation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "crmt-ablation-internal-${{ matrix.ablation }}-${{ matrix.shard }}"
          path: outputs/
          if-no-files-found: error
          retention-days: 90
