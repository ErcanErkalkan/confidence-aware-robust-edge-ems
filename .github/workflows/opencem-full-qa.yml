name: OpenCEM full immutable verification and QA

on:
  push:
    paths:
      - ".github/workflows/opencem-full-qa.yml"
      - "tools/opencem_ingest.py"
      - "tools/opencem_qa.py"
      - "src/data_adapters/opencem.py"
      - "reproducibility/manifests/opencem_git_tree_manifest_v2.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Download and verify all immutable OpenCEM partitions
        run: |
          mkdir -p .tmp/opencem .tmp/verification .tmp/qa
          python tools/opencem_ingest.py \
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \
            --raw-root .tmp/opencem \
            --result-csv .tmp/verification/opencem_full.csv \
            --result-json .tmp/verification/opencem_full.json

      - name: Assert 19-of-19 immutable verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path(".tmp/verification/opencem_full.json").read_text(encoding="utf-8"))
          assert data["files"] == 19, data
          assert data["verified"] == 19, data
          assert data["all_verified"] is True, data
          assert data["total_verified_bytes"] == 883_382_698, data
          assert all(r["verified"] for r in data["results"]), data
          assert all(r["sha256"] for r in data["results"]), data
          print("19/19 immutable partitions verified")
          print("total_verified_bytes =", data["total_verified_bytes"])
          PY

      - name: Run full verified-data QA
        run: |
          python tools/opencem_qa.py \
            --raw-root .tmp/opencem \
            --verification-csv .tmp/verification/opencem_full.csv \
            --output-json .tmp/qa/opencem_qa_full.json \
            --expected-inverters 1,2

      - name: Print claim-safe QA summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          q = json.loads(Path(".tmp/qa/opencem_qa_full.json").read_text(encoding="utf-8"))
          summary = {
              "files": q["files"],
              "rows": q["rows"],
              "inverter_ids": q["inverter_ids"],
              "timestamp_utc_min": q["timestamp_utc_min"],
              "timestamp_utc_max": q["timestamp_utc_max"],
              "duplicate_read_ts_inverter": q["duplicate_read_ts_inverter"],
              "train_only_cadence_selection": q["train_only_cadence_selection"],
              "complete_days_95pct_per_inverter": q["complete_days_95pct_per_inverter"],
              "complete_days_by_split": q["complete_days_by_split"],
              "train_only_grid_cap_calibration": q["train_only_grid_cap_calibration"],
              "neutral_peak_flag_verified": q["neutral_peak_flag_verified"],
          }
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload verification and QA metadata only
        uses: actions/upload-artifact@v4
        with:
          name: opencem-full-verification-and-qa
          path: |
            .tmp/verification/
            .tmp/qa/
          if-no-files-found: error
          retention-days: 14
