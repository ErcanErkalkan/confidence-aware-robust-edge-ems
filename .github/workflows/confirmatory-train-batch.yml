name: Confirmatory TRAIN batch launch v1

on:
  push:
    branches:
      - main
    paths:
      - "reproducibility/launch/CONFIRMATORY_TRAIN_BATCH_V1.token"

permissions:
  contents: read

jobs:
  train-batch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - method: SOBOL
            seed_start: 1001
            seed_end: 1030
            shard: all
          - method: NSGAII
            seed_start: 1001
            seed_end: 1030
            shard: all
          - method: MOPSO
            seed_start: 1001
            seed_end: 1030
            shard: all
          - method: MODE
            seed_start: 1001
            seed_end: 1030
            shard: all
          - method: CRMT
            seed_start: 1001
            seed_end: 1006
            shard: 01
          - method: CRMT
            seed_start: 1007
            seed_end: 1012
            shard: 02
          - method: CRMT
            seed_start: 1013
            seed_end: 1018
            shard: 03
          - method: CRMT
            seed_start: 1019
            seed_end: 1024
            shard: 04
          - method: CRMT
            seed_start: 1025
            seed_end: 1030
            shard: 05
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e .

      - name: Verify launch token
        run: |
          python - <<'PY'
          from pathlib import Path
          token = Path("reproducibility/launch/CONFIRMATORY_TRAIN_BATCH_V1.token").read_text()
          assert "protocol=opencem-confirmatory-prelock-v1" in token
          assert "budget=12600" in token
          assert "seeds=1001-1030" in token
          assert "methods=SOBOL,NSGAII,MOPSO,MODE,CRMT" in token
          PY

      - name: Acquire immutable OpenCEM data once for this shard
        run: |
          mkdir -p .tmp/opencem .tmp/verification outputs
          python tools/opencem_ingest.py \
            --manifest reproducibility/manifests/opencem_git_tree_manifest_v2.csv \
            --raw-root .tmp/opencem \
            --result-csv .tmp/verification/opencem_full.csv \
            --result-json .tmp/verification/opencem_full.json

      - name: Execute frozen TRAIN batch
        run: |
          python tools/opencem_confirmatory_batch.py \
            --method "${{ matrix.method }}" \
            --seed-start "${{ matrix.seed_start }}" \
            --seed-end "${{ matrix.seed_end }}" \
            --raw-root .tmp/opencem \
            --verification-csv .tmp/verification/opencem_full.csv \
            --block-lock-json reproducibility/manifests/opencem_complete_day_blocks_lock_v1.json \
            --output-root outputs

      - name: Upload batch evidence
        uses: actions/upload-artifact@v4
        with:
          name: "confirmatory-train-batch-${{ matrix.method }}-${{ matrix.shard }}"
          path: |
            outputs/
            .tmp/verification/opencem_full.json
          if-no-files-found: error
          retention-days: 90
